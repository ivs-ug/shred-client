[package]
name = "shred-client"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1"
color-eyre = "0.6.5"
prost = "0.14.1"
serde = { version = "1.0.228", features = ["derive"] }
solana-hash = { version = "4.0.1", features = ["serde"] }
solana-message = "3.0.1"
solana-transaction = { version = "3.0.2", features = ["serde"] }
tokio = { version = "1.48.0", features = ["full"] }
tonic = "0.14.1"
tonic-prost = "0.14.1"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"

[build-dependencies]
protox = "0.9.0"
tonic-build = "0.14.1"
tonic-prost-build = "0.14.1"
